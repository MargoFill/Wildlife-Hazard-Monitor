; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ── Octal (OPI) flash + PSRAM — REQUIRED on our boards ───────────────────
; Our modules have octal flash. The stock board definition assumes quad ("qio"),
; and a quad-built image panics at boot on this hardware with:
;     assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)
; The boot log gives it away: "Octal Flash Mode Enabled".
board_build.flash_mode = opi
board_build.arduino.memory_type = opi_opi

build_flags =
	-D BOARD_HAS_PSRAM             ; 8 MB PSRAM — headroom for TinyML later
	-D ARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> the UART port (see note below)

